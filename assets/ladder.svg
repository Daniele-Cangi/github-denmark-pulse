<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ladder-title ladder-desc" viewBox="0 0 900 460">
  <title id="ladder-title">Daniele-Cangi Denmark ranking ladder</title>
  <desc id="ladder-desc">Number 1 is at the top. Public contribution rank climbed 116 places from number 145 on 23 May 2026 to number 29 on 2 October 2026. Top 25 is 4 places away.</desc>
  <style>
    .frame, .rule, .track, .connector { fill: none; stroke: #d0d7de; }
    .label { fill: #24292f; }
    .muted { fill: #57606a; }
    .climb { stroke: #0969da; }
    .current { fill: #0969da; stroke: #ffffff; }
    .baseline { fill: #6e7781; stroke: #ffffff; }
    .milestone.reached { stroke: #1a7f37; }
    .milestone.next { stroke: #0969da; }
    .milestone.future { stroke: #afb8c1; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .frame, .rule, .track, .connector { stroke: #30363d; }
      .label { fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .climb, .milestone.next { stroke: #58a6ff; }
      .current { fill: #58a6ff; stroke: #0d1117; }
      .baseline { fill: #8b949e; stroke: #0d1117; }
      .milestone.reached { stroke: #3fb950; }
      .milestone.future { stroke: #484f58; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="899" height="459"/>
  <text class="label" x="60" y="34" font-size="16" font-weight="600" letter-spacing="1.5">RANKING LADDER</text>
  <text class="muted" x="840" y="34" text-anchor="end" font-size="12" letter-spacing="0.8">#1 IS HIGHER · LOWER NUMBER = BETTER</text>
  <line class="rule" x1="60" x2="840" y1="52" y2="52"/>
  <line class="track" x1="450" x2="450" y1="86" y2="398" stroke-width="4" stroke-linecap="round"/>
  <g><line class="milestone future" data-milestone="1" data-status="future" x1="438" x2="462" y1="86.0" y2="86.0" stroke-width="5" stroke-linecap="round"/><text class="muted" x="490" y="90.0" font-size="13" font-weight="400">#1</text></g>
  <g><line class="milestone next" data-milestone="25" data-status="next" x1="438" x2="462" y1="136.3" y2="136.3" stroke-width="5" stroke-linecap="round"/><text class="label" x="490" y="140.3" font-size="13" font-weight="600">TOP 25 · NEXT (4 PLACES)</text></g>
  <g><line class="milestone reached" data-milestone="50" data-status="reached" x1="438" x2="462" y1="188.6" y2="188.6" stroke-width="5" stroke-linecap="round"/><text class="label" x="490" y="192.6" font-size="13" font-weight="600">TOP 50 · REACHED</text></g>
  <g><line class="milestone reached" data-milestone="75" data-status="reached" x1="438" x2="462" y1="241.0" y2="241.0" stroke-width="5" stroke-linecap="round"/><text class="label" x="490" y="245.0" font-size="13" font-weight="600">TOP 75 · REACHED</text></g>
  <g><line class="milestone reached" data-milestone="100" data-status="reached" x1="438" x2="462" y1="293.3" y2="293.3" stroke-width="5" stroke-linecap="round"/><text class="label" x="490" y="297.3" font-size="13" font-weight="600">TOP 100 · REACHED</text></g>
  <line class="climb" x1="450" x2="450" y1="387.5" y2="144.6" stroke-width="6" stroke-linecap="round"/>
  <line class="connector" x1="418" x2="438" y1="144.6" y2="144.6"/>
  <circle class="current" data-rank="29" cx="450" cy="144.6" r="10" stroke-width="3"/>
  <text class="label" x="408" y="149.6" text-anchor="end" font-size="15" font-weight="600">2 October 2026 · #29</text>
  <line class="connector" x1="418" x2="438" y1="387.5" y2="387.5"/>
  <circle class="baseline" data-rank="145" cx="450" cy="387.5" r="7" stroke-width="3"/>
  <text class="muted" x="408" y="392.5" text-anchor="end" font-size="13">23 May 2026 · #145</text>
  <text class="label" x="400" y="271.1" text-anchor="end" font-size="14" font-weight="600">↑ 116 PLACES</text>
  <line class="rule" x1="60" x2="840" y1="418" y2="418"/>
  <text class="muted" x="60" y="442" font-size="11" letter-spacing="0.8">FIRST VERIFIED THRESHOLDS · NOT A FORECAST</text>
  <text class="muted" x="840" y="442" text-anchor="end" font-size="11">through 2 October 2026</text>
</svg>
